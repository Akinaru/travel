# Production (Coolify). Local development uses docker-compose.dev.yml.
services:
  app:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Separate variables rather than a URL: the password may contain / + = without encoding.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-voyages}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      PGDATABASE: ${POSTGRES_DB:-voyages}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    # No host port: Coolify's proxy routes the domain to this port.
    expose:
      - "3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyages}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-voyages}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyages}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  uploads:
